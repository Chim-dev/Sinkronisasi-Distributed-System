services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    env_file: ../.env.example
    environment:
      NODE_ID: node1
      NODE_PORT: 8001
      DATA_DIR: /data
    ports:
      - "8001:8001"
    volumes:
      - node1-data:/data
    depends_on:
      - redis

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    env_file: ../.env.example
    environment:
      NODE_ID: node2
      NODE_PORT: 8002
      DATA_DIR: /data
    ports:
      - "8002:8002"
    volumes:
      - node2-data:/data
    depends_on:
      - redis

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    env_file: ../.env.example
    environment:
      NODE_ID: node3
      NODE_PORT: 8003
      DATA_DIR: /data
    ports:
      - "8003:8003"
    volumes:
      - node3-data:/data
    depends_on:
      - redis

volumes:
  redis-data:
  node1-data:
  node2-data:
  node3-data:
